<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #grad { position: absolute; left: 0; top: 700px; width: 1080px; height: 1220px;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.48) 35%, rgba(0,0,0,0.55) 100%); }
    .mot { position: absolute; left: 120px; top: 940px; width: 660px; color: #fff; font-family: "Inter", sans-serif; }
    .k { font-weight: 700; font-size: 28px; letter-spacing: 0.26em; display: flex; align-items: center; gap: 18px; opacity: 0.95; }
    .bar { display: block; width: 44px; height: 5px; background: #FF5CAA; transform-origin: 0 50%; }
    .t { margin-top: 22px; }
    .l { overflow: hidden; padding-bottom: 6px; }
    .l span { display: inline-block; font-weight: 900; font-size: 92px; line-height: 0.98; letter-spacing: -0.045em;
      text-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  </style>
  <div id="root" data-composition-id="mots" data-width="1080" data-height="1920" data-layout-allow-overflow>
    <div id="grad"></div>
__WORDS__
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Frame 0 is the thumbnail: the first line is already on screen, it only settles.
    [__TIMING__].forEach(([id, s, e], n) => {
      const lines = `#${id} .l span`;
      if (n > 0) {
        tl.fromTo(`#${id} .bar`, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, s);
        tl.fromTo(`#${id}-k`, { opacity: 0, x: -16 }, { opacity: 0.95, x: 0, duration: 0.3, ease: "power3.out" }, s);
        tl.fromTo(lines, { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power4.out", stagger: 0.07 }, s + 0.08);
      }
      tl.to(lines, { yPercent: -105, duration: 0.28, ease: "power3.in", stagger: 0.04 }, e - 0.34);
      tl.to(`#${id}-k`, { opacity: 0, duration: 0.2, ease: "power2.in" }, e - 0.24);
    });
    tl.to("#grad", { opacity: 0, duration: 0.3 }, __END__ - 0.3);
    window.__timelines["mots"] = tl;
  </script>
</template>
